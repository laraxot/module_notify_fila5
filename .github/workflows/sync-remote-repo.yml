name: Sync Remote Repo

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  sync:
    if: github.ref == 'refs/heads/dev' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      CI: true

    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}
          submodules: false

      - name: Configure Git authentication
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git config --global core.symlinks false
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/bashscripts"
          git config --global url."https://x-access-token:${{ secrets.BASHSCRIPTS_TOKEN }}@github.com/".insteadOf "git@github.com:"

      - name: Checkout bashscripts repository
        uses: actions/checkout@v4
        with:
          repository: laraxot/bashscripts_fila5
          ref: dev
          token: ${{ secrets.BASHSCRIPTS_TOKEN }}
          path: bashscripts
          fetch-depth: 0
          sparse-checkout: |
            git/
            lib/
            gitmodules.ini
          sparse-checkout-cone-mode: false

      - name: Verify sync prerequisites
        run: |
          test -f gitmodules.ini
          test -f bashscripts/git/subtrees/sync_remote_repo.sh
          bash -n bashscripts/git/subtrees/sync_remote_repo.sh

      - name: Run remote sync
        run: |
          chmod +x bashscripts/git/subtrees/sync_remote_repo.sh
          bashscripts/git/subtrees/sync_remote_repo.sh laraxot
        env:
          BASHSCRIPTS_TOKEN: ${{ secrets.BASHSCRIPTS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          CI: true

      - name: Commit synced files to main repository
        run: |
          git status --short

          if [ -z "$(git status --porcelain -- . ':(exclude)bashscripts')" ]; then
            echo "No tracked changes produced by sync_remote_repo.sh"
            exit 0
          fi

          git add -A .
          git reset bashscripts || true
          git commit -m "chore: persist synced remote repo changes [skip ci]"
          git pull --rebase origin dev
          git push origin HEAD:dev
