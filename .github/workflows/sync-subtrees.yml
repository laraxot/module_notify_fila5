name: 🔄 Sync Subtrees

on:
  push:
    branches:
      - dev
  workflow_dispatch:

env:
  GIT_AUTHOR_NAME: GitHub Actions
  GIT_AUTHOR_EMAIL: actions@github.com
  GIT_COMMITTER_NAME: GitHub Actions
  GIT_COMMITTER_EMAIL: actions@github.com

jobs:
  sync-subtrees:
    name: Sync Git Subtrees
    runs-on: ubuntu-latest
    
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SUBTREE_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
      
      - name: 🔑 Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SUBTREE_SSH_KEY }}
      
      - name: 🛡️ Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config --global pull.rebase true
          git config --global push.autoSetupRemote true
          git config --global init.defaultBranch main
          # Add GitHub to known hosts
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/known_hosts
      
      - name: 📋 Show gitmodules.ini
        run: |
          echo "📋 Configuration:"
          cat gitmodules.ini | head -20
      
      - name: 🔄 Sync Subtrees
        run: |
          echo "🚀 Starting subtree sync..."
          echo "📂 Working directory: $(pwd)"
          echo "🌿 Current branch: $(git branch --show-current)"
          echo ""
          bash bashscripts/git/subtrees/sync_remote_repo.sh
        env:
          CI: "true"
      
      - name: ✅ Sync Complete
        run: |
          echo "✅ Subtree synchronization completed successfully!"
          echo ""
          echo "📊 Summary:"
          echo "- Synced all subtrees from gitmodules.ini"
          echo "- Branch: ${{ github.ref_name }}"
          echo "- Commit: ${{ github.sha }}"
