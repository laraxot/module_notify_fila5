name: 🔄 Sync Subtrees

on:
  push:
    branches:
      - dev
  workflow_dispatch:

env:
  GIT_AUTHOR_NAME: GitHub Actions
  GIT_AUTHOR_EMAIL: actions@github.com
  GIT_COMMITTER_NAME: GitHub Actions
  GIT_COMMITTER_EMAIL: actions@github.com

jobs:
  sync-subtrees:
    name: Sync Git Subtrees
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev' || github.event_name == 'workflow_dispatch'

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.BASHSCRIPTS_TOKEN }}
          submodules: false

      - name: 🛡️ Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config --global core.symlinks false
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/bashscripts"
          git config --global url."https://x-access-token:${{ secrets.BASHSCRIPTS_TOKEN }}@github.com/".insteadOf "git@github.com:"
          git config --global url."https://x-access-token:${{ secrets.BASHSCRIPTS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: ⬇️ Checkout bashscripts repository
        uses: actions/checkout@v5
        with:
          repository: laraxot/bashscripts_fila5
          ref: dev
          token: ${{ secrets.BASHSCRIPTS_TOKEN }}
          path: bashscripts
          fetch-depth: 0

      - name: 📋 Show gitmodules.ini
        run: |
          echo "📋 Configuration:"
          cat bashscripts/gitmodules.ini | head -20 || cat gitmodules.ini | head -20 || echo "⚠️ gitmodules.ini not found"

      - name: 🔄 Sync Subtrees
        run: |
          echo "🚀 Starting subtree sync..."
          echo "📂 Working directory: $(pwd)"
          echo "🌿 Current branch: $(git branch --show-current)"
          echo ""
          # Copy gitmodules.ini if needed
          if [ ! -f gitmodules.ini ] && [ -f bashscripts/gitmodules.ini ]; then
            cp bashscripts/gitmodules.ini gitmodules.ini
          fi
          chmod +x bashscripts/git/subtrees/sync_remote_repo.sh
          bash bashscripts/git/subtrees/sync_remote_repo.sh
        env:
          CI: "true"

      - name: ✅ Sync Complete
        run: |
          echo "✅ Subtree synchronization completed successfully!"
          echo ""
          echo "📊 Summary:"
          echo "- Synced all subtrees from gitmodules.ini"
          echo "- Branch: ${{ github.ref_name }}"
          echo "- Commit: ${{ github.sha }}"
