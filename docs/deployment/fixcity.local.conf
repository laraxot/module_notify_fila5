# <nome progetto> Local Development VirtualHost Configuration
# Server: <nome progetto>.local
# Document Root: public_html
# Last Updated: 2026-03-31
#
# SSOT: This file is the canonical vhost config.
# Deploy: sudo cp laravel/config/vhost/<nome progetto>.local.conf /etc/apache2/sites-available/
# Reload: sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName <nome progetto>.local
    ServerAlias www.<nome progetto>.local

    DocumentRoot /var/www/_bases/<repo progetto>/public_html

    <Directory /var/www/_bases/<repo progetto>/public_html>
        Options -Indexes +FollowSymLinks +MultiViews
        AllowOverride All
        Require all granted
    </Directory>

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/<nome progetto>.local-error.log
    CustomLog ${APACHE_LOG_DIR}/<nome progetto>.local-access.log combined

    # Security headers
    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set X-XSS-Protection "1; mode=block"
    </IfModule>
</VirtualHost>

# /etc/hosts entry:
# 127.0.0.1 <nome progetto>.local www.<nome progetto>.local
